name: Deploy Flask App with Docker

on:
  push:
    branches:
      - aparna  # Trigger deployment on push to the main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Docker Buildx (optional, used for cross-platform builds)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Step 3: Log in to GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}  # Use GitHub username
        password: ${{ secrets.GITHUB_TOKEN }}  # GitHub token to authenticate

    # Step 4: Build Docker image
    - name: Build Docker Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/flask-app:latest .

    # Step 5: Push Docker image to GitHub Container Registry
    - name: Push Docker Image to GitHub Container Registry
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/flask-app:latest

    # Step 6: Deploy the Docker container (example for Azure Web App)
    - name: Deploy to Azure Web App
      uses: Azure/webapps-deploy@v2
      with:
        app-name: your-app-name  # Replace with your Azure Web App name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}  # Store the Azure publish profile in GitHub Secrets
        images: 'ghcr.io/${{ github.repository_owner }}/flask-app:latest'
